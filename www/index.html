<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>记忆图谱</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>记忆图谱</h1>
    <span id="vault-label" class="muted">vault</span>
  </header>

  <!-- Tab 导航 -->
  <nav class="tabs">
    <button data-tab="browse" class="tab">浏览</button>
    <button data-tab="quick" class="tab active">今日速记</button>
    <button data-tab="people" class="tab">人物</button>
    <button data-tab="git" class="tab">git</button>
    <button data-tab="settings" class="tab">设置</button>
  </nav>

  <!-- 浏览 -->
  <section id="tab-browse" class="panel">
    <div class="card">
      <h2>记忆库</h2>
      <div class="row">
        <button id="browse-refresh" class="primary">刷新</button>
        <select id="browse-year">
          <option value="">全部年份</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026">2026</option>
        </select>
      </div>
      <div class="browse-stats muted" id="browse-stats"></div>
    </div>
    <div id="browse-list"></div>
    <div id="browse-detail" class="card hidden">
      <div class="row">
        <button id="browse-back">← 返回</button>
        <button id="browse-edit" class="primary">编辑</button>
      </div>
      <div id="browse-detail-content"></div>
    </div>
  </section>

  <!-- 今日速记 -->
  <section id="tab-quick" class="panel active">
    <div class="card">
      <h2>记录今天</h2>
      <input type="date" id="quick-date">
      <textarea id="quick-text" placeholder="今天发生了什么？一段或几段，空行分隔…" rows="5"></textarea>
      <div class="row">
        <button id="quick-preview" class="primary">生成链接</button>
        <button id="quick-apply" disabled>确认落盘</button>
      </div>
    </div>
    <div id="quick-result" class="card hidden">
      <h3>链接预览</h3>
      <div id="quick-links"></div>
      <h3>待确认新实体</h3>
      <div id="quick-candidates"></div>
      <h3>回忆归类</h3>
      <div id="quick-recollections"></div>
      <h3>文件改动</h3>
      <div id="quick-files"></div>
    </div>
  </section>

  <!-- 人物 -->
  <section id="tab-people" class="panel">
    <div class="card">
      <h2>新建人物</h2>
      <input id="person-name" placeholder="姓名（如 刘世杰）">
      <input id="person-aliases" placeholder="别名，逗号分隔（如 阿杰,lsj）">
      <input id="person-relation" placeholder="与作者关系（如 本科同学）">
      <input id="person-summary" placeholder="一句话备注">
      <button id="person-create" class="primary">创建人物页</button>
    </div>
    <div class="card">
      <h3>已有实体</h3>
      <div id="entity-list" class="muted">加载中…</div>
    </div>
    <div id="person-detail" class="card hidden">
      <div class="row">
        <button id="person-back">← 返回</button>
        <button id="person-edit" class="primary">编辑详情</button>
      </div>
      <div id="person-detail-content"></div>
    </div>
  </section>

  <!-- 编辑器 -->
  <section id="tab-editor" class="panel">
    <div class="card">
      <div class="row">
        <button id="editor-back">← 返回</button>
        <span id="editor-title" class="muted" style="margin-left:8px;align-self:center"></span>
      </div>
      <textarea id="editor-content" rows="14" style="font-family:ui-monospace,monospace;font-size:13px;margin-top:8px"></textarea>
      <div class="row">
        <button id="editor-preview" class="primary">预览改动</button>
        <button id="editor-save" disabled>确认保存</button>
        <button id="editor-undo" class="danger">撤销修改</button>
      </div>
      <div id="editor-diff" class="diff hidden" style="margin-top:8px"></div>
      <div id="editor-msg" class="muted" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- 设置 -->
  <section id="tab-settings" class="panel">
    <div class="card">
      <h2>记忆库路径</h2>
      <div class="muted" style="margin-bottom:8px">当前记忆库：<code id="vault-current"></code></div>
      <input id="vault-path" placeholder="输入记忆库文件夹路径，如 D:\记录\记忆图谱">
      <div class="row">
        <button id="vault-save" class="primary">保存并切换</button>
        <button id="vault-reload" class="secondary">重新加载</button>
      </div>
      <div id="vault-msg" class="muted" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- git -->
  <section id="tab-git" class="panel">
    <div class="card">
      <h2>git 同步</h2>
      <button id="git-status" class="primary">刷新状态</button>
      <div id="git-result" class="muted">点击刷新查看工作区改动</div>
    </div>
  </section>

  <!-- 撤销确认弹窗 -->
  <div id="undo-modal" class="modal hidden">
    <div class="modal-box">
      <h3>确认撤销</h3>
      <div id="undo-modal-text" class="muted"></div>
      <div class="row" style="margin-top:12px">
        <button id="undo-cancel" class="secondary">取消</button>
        <button id="undo-confirm" class="danger">撤销</button>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
