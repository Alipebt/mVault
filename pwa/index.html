<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="color-scheme" content="light dark">
<title>记忆库 · Memory Vault</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 主界面：四 Tab -->
  <section id="screen-main" class="screen active">
    <header>
      <h1 id="main-title">记录今天</h1>
    </header>

    <!-- Tab: 记录今天 -->
    <div id="page-quick" class="tab-page active">
      <div class="card">
        <h2>记录今天</h2>
        <input type="date" id="quick-date">
        <textarea id="quick-text" placeholder="今天发生了什么？一段或几段，空行分隔…" rows="6"></textarea>
        <div class="row">
          <button id="quick-preview" class="primary" style="flex:1">生成链接</button>
          <button id="quick-apply" class="primary hidden" style="flex:1">确认落盘</button>
        </div>
      </div>
      <div id="quick-result" class="card hidden">
        <h3>链接预览</h3>
        <div id="quick-links"></div>
      </div>
    </div>

    <!-- Tab: 记忆库 -->
    <div id="page-browse" class="tab-page">
      <!-- 类型切换：日记 / 人物 / 回忆 -->
      <div class="seg">
        <button class="seg-btn active" data-seg="diary">日记</button>
        <button class="seg-btn" data-seg="people">人物</button>
        <button class="seg-btn" data-seg="recollection">回忆</button>
      </div>

      <!-- 日记列表视图 -->
      <div id="browse-seg-diary" class="browse-seg">
        <div class="card">
          <div class="seg-head">
            <span class="seg-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
            </span>
            <h2>日记</h2>
            <span class="seg-count" id="seg-count-diary"></span>
            <button id="browse-refresh" class="ghost">刷新</button>
          </div>
          <div class="browse-stats muted" id="browse-stats"></div>
          <div class="row" style="margin-top:8px">
            <select id="browse-year" style="flex:1">
              <option value="">全部年份</option>
            </select>
          </div>
          <div id="browse-list"></div>
          <div class="pager" id="browse-pager">
            <button id="page-prev" class="ghost">‹ 上一页</button>
            <span id="page-info" class="muted">1/1</span>
            <button id="page-next" class="ghost">下一页 ›</button>
          </div>
        </div>
      </div>

      <!-- 人物列表视图 -->
      <div id="browse-seg-people" class="browse-seg hidden">
        <div class="card">
          <div class="seg-head">
            <span class="seg-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
            </span>
            <h2>人物</h2>
            <span class="seg-count" id="seg-count-people"></span>
          </div>
          <div id="people-list"></div>
        </div>
      </div>

      <!-- 回忆列表视图 -->
      <div id="browse-seg-recollection" class="browse-seg hidden">
        <div class="card">
          <div class="seg-head">
            <span class="seg-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9Z"/></svg>
            </span>
            <h2>回忆</h2>
            <span class="seg-count" id="seg-count-recollection"></span>
          </div>
          <div id="recollection-stages"></div>
        </div>
      </div>

      <!-- 通用详情视图（日记日期 / 人物 / 回忆阶段） -->
      <div id="browse-view-detail" class="hidden">
        <div class="card">
          <div class="row" style="align-items:center">
            <button id="detail-back" class="ghost">‹ 返回</button>
            <h2 id="detail-title" style="flex:1;margin-left:8px">标题</h2>
            <button id="detail-edit" class="primary hidden">修改</button>
          </div>
          <!-- 只读展示（默认） -->
          <div id="detail-view" class="detail-body" style="margin-top:8px"></div>
          <!-- 编辑框（日记日期修改用） -->
          <div id="detail-editor" class="hidden">
            <textarea id="detail-content" rows="10" placeholder="该日期的内容…" style="margin-top:8px"></textarea>
            <div class="row" style="margin-top:8px">
              <button id="detail-save" class="primary" style="flex:1">保存修改</button>
              <button id="detail-cancel" class="ghost" style="flex:1">取消</button>
            </div>
          </div>
          <div id="detail-msg" class="msg muted"></div>
        </div>
        <div class="card">
          <h2>修改历史</h2>
          <div id="detail-history" class="muted">加载中…</div>
        </div>
      </div>
    </div>

    <!-- Tab: git 同步 -->
    <div id="page-git" class="tab-page">
      <div class="card">
        <div class="row" style="align-items:center">
          <h2 style="flex:1">git 同步</h2>
          <button id="git-refresh" class="ghost">刷新</button>
        </div>
        <div id="git-status" class="muted" style="margin-bottom:8px"></div>
        <div class="row">
          <button id="btn-commit" class="primary" style="flex:1">提交改动</button>
          <button id="btn-push" class="primary" style="flex:1">推送</button>
        </div>
      </div>

      <!-- 落盘历史 -->
      <div class="card">
        <h2>落盘记录</h2>
        <div id="undo-info" class="muted" style="margin-bottom:8px">加载中…</div>
        <div id="commit-history"></div>
      </div>

      <!-- 撤回 / 重做 -->
      <div class="card">
        <h2>撤回</h2>
        <div class="row">
          <button id="btn-undo" class="danger" disabled style="flex:1">↩ 撤回上一次</button>
          <button id="btn-redo" class="ghost" disabled style="flex:1">↪ 取消撤回</button>
        </div>
      </div>
    </div>

    <!-- Tab: 设置 -->
    <div id="page-settings" class="tab-page">
      <!-- 连接配置（始终显示，可改） -->
      <div class="card">
        <h2>连接仓库</h2>
        <div id="settings-conn-state" class="muted" style="margin-bottom:8px"></div>
        <label class="lbl">GitHub 仓库 URL</label>
        <input id="repo-url" placeholder="https://github.com/用户名/记忆库.git">
        <label class="lbl">GitHub Token（有仓库读写权限）</label>
        <input id="token" type="password" placeholder="ghp_xxx" autocomplete="off">
        <label class="lbl">CORS 代理（默认官方代理，浏览器访问 GitHub 必需）</label>
        <input id="cors-proxy" placeholder="https://cors.isomorphic-git.org">
        <div class="muted" style="margin:6px 0 10px">Token 仅存于本机浏览器，用于 clone/push。GitHub 对浏览器 git 请求有 CORS 限制，需经代理转发。</div>
        <button id="btn-connect" class="primary">连接仓库</button>
        <div id="setup-msg" class="msg muted"></div>
      </div>

      <!-- 数据与缓存 -->
      <div class="card">
        <h2>数据</h2>
        <div class="muted" style="margin-bottom:12px">
          数据保存在浏览器本地（IndexedDB），GitHub 为同步枢纽。
        </div>
        <div class="row">
          <button id="btn-clear-cache" class="danger" style="flex:1">清除缓存并重新连接</button>
        </div>
        <div id="settings-msg" class="msg muted"></div>
      </div>
    </div>

    <!-- 底部导航 -->
    <nav class="tabbar" aria-label="主导航">
      <button class="tab-btn active" data-tab="quick" aria-label="记录">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
        </span><span>记录</span>
      </button>
      <button class="tab-btn" data-tab="browse" aria-label="记忆库">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="M8 6h8M8 10h8"/></svg>
        </span><span>记忆库</span>
      </button>
      <button class="tab-btn" data-tab="git" aria-label="同步">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0-15.5-3M4 4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 3M20 20v-4h-4"/><path d="M12 8v4l2.5 1.5"/></svg>
        </span><span>同步</span>
      </button>
      <button class="tab-btn" data-tab="settings" aria-label="设置">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v2.4h-.2a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </span><span>设置</span>
      </button>
    </nav>
  </section>
</div>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js?v=7').catch(function (err) {
        console.warn('SW 注册失败（不影响使用）:', err.message);
      });
    });
  }
</script>
<script type="module" src="app.bundle.js?v=7"></script>
</body>
</html>
